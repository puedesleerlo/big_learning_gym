[project]
name = "big-learning-gym"
version = "0.1.0"
description = "An evidence-driven learning and research workbench"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4", "httpx>=0.27,<1", "python-multipart>=0.0.18,<1",
  "python-dotenv>=1,<2", "pypdf>=5,<7", "python-docx>=1.1,<2",
  "python-pptx>=1.0,<2", "icalendar>=6,<8", "bleach>=6,<7"
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
